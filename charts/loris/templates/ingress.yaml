{{- if and .Values.enabled .Values.ingress.enabled }}
{{- range .Values.ingress.definitions }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ required "Each ingress definition requires a name" .name | quote }}
  {{- with .annotations }}
  annotations:
{{ toYaml . | indent 4 }}
  {{- end }}
spec:
  {{- with .className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  {{- with .tls }}
  tls:
{{ toYaml . | indent 4 }}
  {{- end }}
  rules:
    {{- range .hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path | quote }}
            pathType: {{ .pathType | default "Prefix" }}
            backend:
              service:
                name: loris
                port:
                  name: http
          {{- end }}
    {{- end }}
{{- end }}
{{- end }}