{{- if and (include "loris-forgejo-export.enabled" .) .Values.triggers.webhook.enabled (not .Values.triggers.webhook.existingSecret) }}
{{- $name := include "loris-forgejo-export.webhookSecret" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $secret := "" }}
{{- if and $existing $existing.data (index $existing.data "secret") }}
{{- $secret = index $existing.data "secret" }}
{{- else }}
{{- $secret = randAlphaNum 48 | b64enc }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "loris-forgejo-export.labels" . | nindent 4 }}
type: Opaque
data:
  secret: {{ $secret | quote }}
{{- end }}
