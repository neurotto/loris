name: LORIS chart security audits

on:
  pull_request:
    paths:
      - charts/loris/**
      - charts/loris-nfs-export/**
      - tools/security/loris/**
      - .github/workflows/**
  push:
    branches: [main]
    paths:
      - charts/loris/**
      - charts/loris-nfs-export/**
      - tools/security/loris/**
      - .github/workflows/**
  workflow_dispatch:
    inputs:
      chart:
        description: Chart for optional runtime validation and image override
        type: choice
        options: [loris, loris-nfs-export]
        default: loris
      runtime:
        description: Run isolated kind runtime validation (additional CPU/disk required)
        type: boolean
        default: false
      app_image:
        description: Optional image override for the selected chart (prefer an immutable digest)
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: loris-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Audit ${{ matrix.chart }}
    strategy:
      fail-fast: false
      matrix:
        chart: [loris, loris-nfs-export]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install pinned audit tools
        run: python3 tools/security/loris/setup.py
      - name: Test the audit runner
        run: .audit-tools/venv/bin/python -m unittest discover -s tools/security/loris -p 'test_*.py' -v
      - name: Run static and image audit
        env:
          CHART: ${{ matrix.chart }}
          APP_IMAGE: ${{ inputs.chart == matrix.chart && inputs.app_image || '' }}
        run: |
          export PATH="$PWD/.audit-tools/bin:$PWD/.audit-tools/venv/bin:$PATH"
          args=(--chart "$CHART" --output "audit-results/$CHART")
          if [[ -n "$APP_IMAGE" ]]; then args+=(--app-image "$APP_IMAGE"); fi
          python tools/security/loris/audit.py "${args[@]}"
      - name: Upload redacted reports and SBOMs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.chart }}-security-audit
          path: |
            audit-results/${{ matrix.chart }}/report.md
            audit-results/${{ matrix.chart }}/report.json
            audit-results/${{ matrix.chart }}/*.cdx.json
          if-no-files-found: warn
          retention-days: 14

  runtime:
    if: github.event_name == 'workflow_dispatch' && inputs.runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install pinned tools including kind
        run: python3 tools/security/loris/setup.py --runtime
      - name: Run opted-in isolated runtime audit
        env:
          CHART: ${{ inputs.chart }}
          APP_IMAGE: ${{ inputs.app_image }}
        run: |
          export PATH="$PWD/.audit-tools/bin:$PWD/.audit-tools/venv/bin:$PATH"
          args=(--chart "$CHART" --runtime --output audit-results/runtime)
          if [[ -n "$APP_IMAGE" ]]; then args+=(--app-image "$APP_IMAGE"); fi
          python tools/security/loris/audit.py "${args[@]}"
      - name: Upload redacted runtime report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ inputs.chart }}-security-runtime
          path: |
            audit-results/runtime/report.md
            audit-results/runtime/report.json
            audit-results/runtime/*.cdx.json
          if-no-files-found: warn
          retention-days: 14
